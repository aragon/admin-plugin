[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    # read access too: test/unit/script checks the artifact the scripts write
    { access = "read-write", path = "./artifacts" },
    # test/unit/metadata checks that the published metadata matches what the contracts decode
    { access = "read", path = "./script/metadata" },
]
extra_output = ["storageLayout"]
gas_reports = ["Admin", "AdminSetup", "AdminZkSync", "AdminSetupZkSync"]

[fuzz]
runs = 256

[fmt]
# src/ keeps the formatting of the audited code (prettier-solidity); forge fmt cannot reproduce it
ignore = ["src/**/*.sol"]
